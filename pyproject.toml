[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fortran-mcp"
version = "0.1.0"
description = "MCP server for authoritative Fortran documentation"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Minh Dao" }]
keywords = ["fortran", "mcp", "model-context-protocol", "documentation"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "mcp[cli]>=2.0,<3",
]

[project.scripts]
fortran-mcp = "fortran_mcp.server:main"

[dependency-groups]
dev = [
  "mypy>=1.17,<3",
  "pytest>=8.4,<10",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fortran_mcp"]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

