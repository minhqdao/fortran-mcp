name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-extras --all-groups

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy

      - name: Test
        run: uv run pytest

  package:
    name: Package smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Build distributions
        run: uv build

      - name: Install wheel in an isolated environment
        run: |
          uv venv --python 3.14 .package-venv
          uv pip install --python .package-venv/bin/python dist/*.whl

      - name: Verify installed package
        run: |
          .package-venv/bin/python -c \
            "from fortran_mcp.sources import load_registry; assert load_registry().sources"
          .package-venv/bin/fortran-mcp --version
          .package-venv/bin/fortran-mcp --help
          .package-venv/bin/fortran-mcp doctor --json
          .package-venv/bin/fortran-mcp source list --json
          .package-venv/bin/fortran-mcp data verify
          uv pip check --python .package-venv/bin/python
          ! tar -tzf dist/*.tar.gz | grep -q '/todo.md$'
