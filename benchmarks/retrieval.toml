schema_version = 1

# Migration cases use source-neutral content terms so that the benchmark measures
# whether the corpus can answer the question, without choosing a source in advance.

# Compiler-neutral language cases explicitly record whether a dependable answer needs normative
# authority or whether practical guidance is sufficient. A retrieval pass for a normative case
# demonstrates coverage, not that the current source has normative status.

[[cases]]
id = "language-submodules-dependency"
category = "paraphrase"
query = "How can Fortran submodules separate a module interface from its implementation and reduce recompilation?"
expected_terms = ["submodule"]
expected_term_groups = [["dependency", "recompilation"], ["interface", "implementation"]]
answer_authority = "guidance"

